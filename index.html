<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WCC Policies Chabo</title>
  <style>
    *{box-sizing:border-box;}
    :root{--bg:#2f0818;--surface:#3f0f25;--surface-soft:#5a1c36;--text:#f7edf4;--muted:#f5d2df;--accent:#ffb2c9;--accent2:#ff6f89;--accent3:#f7797d;--accent-soft:rgba(255,178,201,0.16);--border:rgba(255,255,255,0.14)}
    html,body{min-height:100vh;height:100%;width:100%;margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top left,rgba(255,175,199,0.22),transparent 35%),radial-gradient(circle at top right,rgba(255,107,149,0.18),transparent 30%),radial-gradient(circle at bottom left,rgba(255,83,120,0.22),transparent 28%),#2f0818;color:var(--text);}
    body{display:flex;align-items:stretch;justify-content:center;padding:0;overflow:hidden;}
    .app{max-width:760px;width:100%;margin:0;padding:20px;background:linear-gradient(180deg,rgba(50,9,24,0.96),rgba(75,12,38,0.94));border-radius:0;box-shadow:none;border:0;backdrop-filter:none;height:100vh;display:flex;flex-direction:column;}
    header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
    h1{font-size:22px;font-weight:700;line-height:1.2;margin:0;color:#ffdfe8}
    .brand-logo{width:48px;height:48px;border-radius:18px;object-fit:cover;border:1px solid rgba(255,255,255,0.18);box-shadow:0 12px 28px rgba(0,0,0,0.18)}
    .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    button{background:linear-gradient(135deg,rgba(255,145,170,0.18),rgba(255,90,110,0.12));color:var(--text);border:1px solid rgba(255,255,255,0.14);padding:10px 14px;border-radius:16px;cursor:pointer;transition:transform .15s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease}
    button:hover{transform:translateY(-1px);background:linear-gradient(135deg,rgba(255,145,170,0.28),rgba(255,90,110,0.2));border-color:rgba(255,255,255,0.22);box-shadow:0 16px 30px rgba(0,0,0,0.18)}
    button.primary{background:linear-gradient(135deg,rgba(255,130,160,0.95),rgba(255,75,105,0.95));color:#28040f;border:none;box-shadow:0 18px 30px rgba(189,53,94,0.28)}
    main{margin-top:18px;flex:1;display:flex;min-height:0;}
    .chat{background:linear-gradient(180deg,rgba(54,13,33,0.96),rgba(51,9,29,0.98));padding:24px;display:flex;flex-direction:column;backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.12);border-radius:26px;min-height:0;flex:1;}
    .messages{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 8px;display:flex;flex-direction:column;gap:12px;min-height:0;}
    .progress{height:10px;border-radius:999px;background:rgba(255,255,255,0.08);overflow:hidden;margin:8px 0;}
    .progress.hidden{display:none;}
    .progress-bar{height:100%;width:0%;background:linear-gradient(90deg,rgba(255,129,151,0.95),rgba(255,88,122,0.9));transition:width 0.25s ease;}
    .msg{max-width:88%;padding:16px;border-radius:18px;white-space:pre-wrap;word-break:break-word;line-height:1.65;box-shadow:0 14px 30px rgba(0,0,0,0.2)}
    .user{align-self:flex-end;background:linear-gradient(135deg,rgba(255,140,170,0.98),rgba(255,215,220,0.9));color:#360d18}
    .bot{align-self:flex-start;background:linear-gradient(135deg,rgba(255,143,171,0.26),rgba(255,83,120,0.18));border:1px solid rgba(255,255,255,0.12);color:var(--text)}
    .meta{font-size:13px;color:var(--muted);margin-bottom:6px}
    .composer{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
    input[type=text]{flex:1;min-width:0;padding:14px 16px;border-radius:16px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.06);color:var(--text);outline:none;box-shadow:inset 0 2px 10px rgba(0,0,0,0.18)}
    input[type=text]::placeholder{color:rgba(255,255,255,0.7)}
    footer{margin-top:20px;font-size:13px;color:var(--muted);text-align:center}
    @media(max-width:720px){
      body{padding:0;}
      .app{margin:0;max-width:100%;padding:14px;min-height:100vh;}
      .chat{padding:18px;}
      .composer{flex-direction:column;}
      button{width:100%;}
      .controls{width:100%;justify-content:flex-end;}
      h1{font-size:20px;}
      .brand-logo{width:44px;height:44px;}
      .messages{padding:8px 4px;gap:10px;}
      .msg{padding:14px;}
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div style="display:flex;align-items:center;gap:14px;min-width:0;">
        <img class="brand-logo" src="logo.jpg" alt="WCC logo" />
        <div style="min-width:0;">
          <h1>WCC Policies Chabo</h1>
          <p style="margin:8px 0 0;color:#d7c9ff;font-size:14px;max-width:520px;line-height:1.5;white-space:normal;">A vibrant policy assistant for WCC documents.</p>
        </div>
      </div>
      <div class="controls">
        <button id="btnClear">Clear</button>
      </div>
    </header>
    <main>
      <section class="chat">
        <div class="messages" id="messages">
          <div class="meta">Loading Degree Policies Combined. Ask questions once it loads.</div>
        </div>
        <div id="progress" class="progress hidden" aria-live="polite">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="composer">
          <input id="query" type="text" placeholder="Ask your question" />
          <button id="ask" class="primary">Ask</button>
        </div>
      </section>
    </main>
    <footer>Developed by Ganesh Panchanathan</footer>
  </div>
  <script>
    const state = {text:'', chunks:[]};
    function normalize(s){return s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
    function isGreeting(query){
      const normalized = normalize(query);
      const greetings = ['hello','hi','hey','greetings','good morning','good afternoon','good evening'];
      return greetings.some(g => normalized === g || normalized.startsWith(g + ' ') || normalized.includes(' ' + g + ' '));
    }
    function hasQuestionIntent(query){
      const normalized = normalize(query);
      return /\?/.test(query) || /\b(what|when|where|who|why|how|can|does|do|is|are|should|would|could|may|might|explain|tell|need|must)\b/.test(normalized);
    }
    function chunkText(text, chunkSize=1000){
      const paragraphs = text.replace(/\r/g,'').split(/\n{2,}/g).map(p=>p.trim()).filter(Boolean);
      const parts=[];
      paragraphs.forEach((paragraph, paragraphId)=>{
        const sentences = paragraph.split(/(?<=[.!?])\s+/g).map(s=>s.trim()).filter(Boolean);
        let chunk = '';
        for(let i=0;i<sentences.length;i++){
          if(!chunk) chunk = sentences[i];
          else chunk += ' ' + sentences[i];
          if(chunk.length >= chunkSize || i === sentences.length - 1){
            parts.push({text:chunk, norm:normalize(chunk), paragraphId});
            chunk = '';
          }
        }
      });
      return parts.map((t,i)=>({id:i,...t}));
    }
    function indexText(txt){
      state.text=txt;
      state.paragraphs = txt.replace(/\r/g,'').split(/\n{2,}/g).map(p=>p.trim()).filter(Boolean).map((text,i)=>({id:i,text,norm:normalize(text)}));
      state.chunks=chunkText(txt);
    }
    function scoreParagraph(queryNorm, paragraph){
      const qTokens = normalize(queryNorm).split(' ').filter(Boolean);
      const pTokens = paragraph.norm.split(' ').filter(Boolean);
      const pTokenSet = new Set(pTokens);
      const common = qTokens.reduce((sum,t)=>sum + (pTokenSet.has(t) ? 1 : 0),0);
      const overlap = common / Math.sqrt(qTokens.length * pTokens.length + 1e-9);
      const exactPhrase = queryNorm && paragraph.norm.includes(queryNorm) ? 1.0 : 0;
      const hasAll = qTokens.length && qTokens.every(t=>pTokenSet.has(t));
      const density = common / (pTokens.length + 1);
      return overlap + exactPhrase + (hasAll ? 0.35 : 0) + Math.min(0.25, density * 3);
    }
    function retrieve(query, topK=4){
      const qn = normalize(query);
      const scored = state.paragraphs.map(p=>({p,score:scoreParagraph(qn,p)}));
      return scored.filter(r=>r.score>0).sort((a,b)=>b.score-a.score).slice(0,topK);
    }
    function extractQuestionTopic(queryNorm){
      const stopWords = new Set(['the','a','an','and','or','of','to','in','for','on','with','by','is','are','was','were','be','can','should','would','could','may','might','this','that','it','as','at','from','about','i','my','me','you','please','help']);
      const tokens = queryNorm.split(' ').filter(Boolean).filter(t=>!stopWords.has(t));
      if(!tokens.length) return '';
      const counts = tokens.reduce((acc,token)=>{acc[token]=(acc[token]||0)+1;return acc;},{});
      return Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).slice(0,3).join(' ');
    }
    function formatParagraphs(paragraphs){
      return paragraphs.map(p => p.p.text.trim()).join('\n\n');
    }
    function expandParagraphContext(paragraphId){
      const paragraphs = state.paragraphs;
      const context = [];
      let index = paragraphId;
      while(index < paragraphs.length && context.length < 3){
        context.push(paragraphs[index]);
        const combinedLength = context.reduce((sum,p)=>sum + p.text.length,0);
        if(combinedLength > 240) break;
        index += 1;
      }
      return context;
    }
    function createHumanAnswer(query, paragraphs){
      const greeting = isGreeting(query) ? 'Hello! ' : '';
      if(!hasQuestionIntent(query) && isGreeting(query)){
        return `${greeting}I’m here to answer any WCC policy questions you have.`;
      }
      const text = formatParagraphs(paragraphs);
      if(!text){
        return `${greeting}I found a policy section that may be relevant, but can you ask the question more specifically?`;
      }
      return `${greeting}Based on the policy, the most relevant section is:\n\n${text}`;
    }
    function synthesizeAnswer(query,matches){
      if(!matches.length) return {answer:'I could not locate a matching policy reference. Please try a different policy term or ask more clearly.',confidence:0};
      const primary = matches[0].p;
      const paragraphs = primary.text.trim().length < 80 ? expandParagraphContext(primary.id) : [primary];
      const answerText = createHumanAnswer(query, paragraphs);
      return {
        answer: answerText,
        confidence: Math.min(0.96, 0.6 + matches[0].score * 0.24)
      };
    }
    function setProgress(active){
      const progress = document.getElementById('progress');
      const bar = document.getElementById('progressBar');
      if(active){
        progress.classList.remove('hidden');
        bar.style.width = '20%';
        setTimeout(()=>{bar.style.width = '55%';}, 100);
        setTimeout(()=>{bar.style.width = '85%';}, 300);
      } else {
        bar.style.width = '100%';
        setTimeout(()=>{progress.classList.add('hidden');bar.style.width='0%';}, 260);
      }
    }
    function appendMessage(text,cls){
      const container=document.getElementById('messages');
      const div=document.createElement('div');div.className='msg '+cls;div.innerText=text;
      container.appendChild(div);container.scrollTop=container.scrollHeight;
    }
    function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[c]);}
    document.getElementById('ask').addEventListener('click',runQuery);
    document.getElementById('query').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();runQuery();}});
    function runQuery(){
      const q=document.getElementById('query').value.trim(); if(!q) return; appendMessage(q,'user'); document.getElementById('query').value='';
      if(!state.text){appendMessage('No document loaded.','bot');return;}
      if(isGreeting(q) && !hasQuestionIntent(q)){
        appendMessage('Hello! How can I help you with WCC policy today?','bot');
        return;
      }
      setProgress(true);
      setTimeout(()=>{
        const matches=retrieve(q,5);
        const out=synthesizeAnswer(q,matches);
        appendMessage(out.answer+`\n\n(Confidence: ${(out.confidence*100).toFixed(0)}%)`,'bot');
        setProgress(false);
      }, 120);
    }
    document.getElementById('btnClear').addEventListener('click',()=>{document.getElementById('messages').innerHTML=''; appendMessage('Conversation cleared','bot');});
    async function init(){
      const fileName = 'Degree_Policies_Combined.txt';
      try{
        const res = await fetch(fileName);
        if(!res.ok) throw new Error('File not found');
        const txt = await res.text();
        indexText(txt);
        document.getElementById('messages').innerHTML = '';
        appendMessage('I am your chat buddy and I can answer your questions related to policy.', 'bot');
      }catch(e){
        const fallback = `# WCC Policies Chabo\nCould not load ${fileName}.`;
        indexText(fallback);
        document.getElementById('messages').innerHTML = '';
        appendMessage(`Failed to load ${fileName}; please ensure it exists in the same folder.`, 'bot');
      }
    }
    init();
  </script>
</body>
</html>

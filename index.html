<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WCC Policies Chabo</title>
  <style>
    :root{--bg:#12021d;--surface:#2c0f33;--surface-soft:#3f1f53;--text:#f8f0fb;--muted:#e7c6e9;--accent:#ff6b95;--accent2:#6b64ff;--accent3:#39d1c7;--accent-soft:rgba(255,107,149,0.16);--border:rgba(255,255,255,0.16)}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top left,rgba(255,107,149,0.18),transparent 35%),radial-gradient(circle at top right,rgba(107,100,255,0.2),transparent 30%),radial-gradient(circle at bottom left,rgba(57,209,199,0.18),transparent 28%),#12021d;color:var(--text)}
    .app{max-width:980px;margin:28px auto;padding:26px;background:linear-gradient(180deg,rgba(255,255,255,0.08),rgba(255,255,255,0.02));border-radius:28px;box-shadow:0 32px 90px rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(8px)}
    header{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
    h1{font-size:24px;font-weight:700;line-height:1.2;margin:0}
    .controls{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    button{background:linear-gradient(135deg,rgba(255,107,149,0.15),rgba(107,100,255,0.15));color:var(--text);border:1px solid rgba(255,255,255,0.12);padding:10px 14px;border-radius:16px;cursor:pointer;transition:transform .15s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease}
    button:hover{transform:translateY(-1px);background:linear-gradient(135deg,rgba(255,107,149,0.3),rgba(107,100,255,0.25));border-color:rgba(255,255,255,0.22);box-shadow:0 18px 35px rgba(255,107,149,0.16)}
    button.primary{background:linear-gradient(135deg,rgba(255,107,149,0.98),rgba(57,209,199,0.98));color:#1b0218;border:none;box-shadow:0 20px 38px rgba(255,107,149,0.25)}
    main{margin-top:22px}
    .chat{background:linear-gradient(180deg,rgba(255,255,255,0.12),rgba(255,255,255,0.04));padding:32px 28px;min-height:540px;display:flex;flex-direction:column;backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.14);border-radius:28px}
    .messages{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:14px}
    .msg{max-width:85%;padding:18px;border-radius:20px;white-space:pre-wrap;word-break:break-word;line-height:1.7;box-shadow:0 16px 36px rgba(0,0,0,0.16)}
    .user{align-self:flex-end;background:linear-gradient(135deg,rgba(255,107,149,0.94),rgba(255,191,140,0.85));color:#360d18}
    .bot{align-self:flex-start;background:linear-gradient(135deg,rgba(107,100,255,0.18),rgba(57,209,199,0.16));border:1px solid rgba(255,255,255,0.12);color:var(--text)}
    .meta{font-size:13px;color:var(--muted);margin-bottom:6px}
    .composer{display:flex;gap:10px;margin-top:14px}
    input[type=text]{flex:1;padding:14px 16px;border-radius:16px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.08);color:var(--text);outline:none}
    input[type=text]::placeholder{color:rgba(255,255,255,0.65)}
    footer{margin-top:24px;font-size:13px;color:var(--muted);text-align:center}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
      <h1>WCC Policies Chabo</h1>
      <p style="margin:8px 0 0;color:#f1cfe6;font-size:14px;max-width:520px;line-height:1.5">A vibrant policy assistant for WCC documents — ask anything about the loaded content.</p>
    </div>
      <div class="controls">
        <button id="btnClear">Clear</button>
      </div>
    </header>
    <main>
      <section class="chat">
        <div class="messages" id="messages">
          <div class="meta">Loading data from AD107-Student-Records.txt. Ask questions once it loads.</div>
        </div>
        <div class="composer">
          <input id="query" type="text" placeholder="Ask a question about the loaded document..." />
          <button id="ask" class="primary">Ask</button>
        </div>
      </section>
    </main>
    <footer>Simple client-side retrieval + snippet synthesis. Works offline in browser.</footer>
  </div>
  <script>
    const state = {text:'', chunks:[]};
    function normalize(s){return s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
    function chunkText(text, chunkSize=800){
      const parts=[];
      const paras = text.split(/\n{2,}/g).map(p=>p.trim()).filter(Boolean);
      for(const p of paras){
        if(p.length<=chunkSize) parts.push(p);
        else for(let i=0;i<p.length;i+=chunkSize) parts.push(p.slice(i,i+chunkSize));
      }
      return parts.map((t,i)=>({id:i,text:t,norm:normalize(t)}));
    }
    function indexText(txt){state.text=txt;state.chunks=chunkText(txt)}
    function scoreChunk(queryNorm, chunk){
      const qTokens = new Set(queryNorm.split(' ').filter(Boolean));
      const cTokens = new Set(chunk.norm.split(' ').filter(Boolean));
      let common=0; qTokens.forEach(t=>cTokens.has(t) && common++);
      return common / Math.sqrt(qTokens.size * cTokens.size + 1e-9);
    }
    function retrieve(query, topK=3){
      const qn=normalize(query);
      return state.chunks.map(c=>({c,score:scoreChunk(qn,c)})).sort((a,b)=>b.score-a.score).slice(0,topK).filter(s=>s.score>0);
    }
    function synthesizeAnswer(query,matches){
      if(!matches.length) return {answer:'I could not find information directly related to that question.',confidence:0};
      const qTokens=normalize(query).split(' ').filter(Boolean);
      const found=[];
      matches.forEach(m=>{
        const sentences=m.c.text.match(/[^.!?]+[.!?]?/g)||[m.c.text];
        sentences.forEach(s=>{
          const sn=normalize(s);
          const hits=qTokens.filter(t=>sn.includes(t)).length;
          if(hits) found.push({s:s.trim(),hits,score:m.score});
        });
      });
      found.sort((a,b)=>b.hits*b.score - a.hits*a.score);
      const uniq=[]; const seen=new Set();
      found.forEach(f=>{if(!seen.has(f.s)&&uniq.length<6){seen.add(f.s);uniq.push(f.s)}});
      const answer=uniq.length?uniq.join(' '):matches.map(m=>m.c.text.slice(0,300)).join('\n\n');
      const confidence=Math.min(0.99,Math.max(...matches.map(m=>m.score)) + (uniq.length?0.15:0));
      return {answer,confidence};
    }
    function appendMessage(text,cls){
      const container=document.getElementById('messages');
      const div=document.createElement('div');div.className='msg '+cls;div.innerText=text;
      container.appendChild(div);container.scrollTop=container.scrollHeight;
    }
    function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[c]);}
    document.getElementById('ask').addEventListener('click',runQuery);
    document.getElementById('query').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();runQuery();}});
    function runQuery(){
      const q=document.getElementById('query').value.trim(); if(!q) return; appendMessage(q,'user'); document.getElementById('query').value='';
      if(!state.text){appendMessage('No document loaded.','bot');return;}
      const matches=retrieve(q,5);
      const out=synthesizeAnswer(q,matches);
      appendMessage(out.answer+`\n\n(Confidence: ${(out.confidence*100).toFixed(0)}%)`,'bot');
    }
    document.getElementById('btnClear').addEventListener('click',()=>{document.getElementById('messages').innerHTML=''; appendMessage('Conversation cleared','bot');});
    async function init(){
      const fileName = 'AD107-Student-Records.txt';
      try{
        const res = await fetch(fileName);
        if(!res.ok) throw new Error('File not found');
        const txt = await res.text();
        indexText(txt);
        document.getElementById('messages').innerHTML = '';
        appendMessage(`Loaded ${fileName} from the same folder. Ask a question now.`, 'bot');
      }catch(e){
        const fallback = `# WCC Policies Chabo\nCould not load ${fileName}.`;
        indexText(fallback);
        document.getElementById('messages').innerHTML = '';
        appendMessage(`Failed to load ${fileName}; please ensure it exists in the same folder.`, 'bot');
      }
    }
    init();
  </script>
</body>
</html>
